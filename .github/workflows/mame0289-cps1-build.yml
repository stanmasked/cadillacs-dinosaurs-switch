name: MAME 0.289 full-tree CPS-1 compile (experimental)

# Intentionally NOT a required per-PR job: upstream emulator compilation
# is resource-intensive and does not require or access commercial ROMs.
on:
  push:
    paths:
      - '.github/workflows/mame0289-cps1-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-instrumented-mame:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      MAME_COMMIT: f34f02505e32c1993c6a782b6814232cbfc74e36
      MAME_TAG: mame0289
    steps:
      - name: Check out our ROM-free probe tooling
        uses: actions/checkout@v4

      - name: Run session-aware ROM-free verifier regressions
        run: |
          python3 -m unittest discover -s tests -p test_mame_dino_binary_verify.py -v
          python3 -m unittest discover -s tests -p test_mame_private_dino_session.py -v

      - name: Install official Debian/Ubuntu MAME build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git build-essential python3 \
            libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libpulse-dev \
            qt6-base-dev qt6-base-dev-tools qtchooser
          c++ --version | head -n1
          python3 --version

      - name: Fetch pinned official MAME 0.289 source tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --single-branch --branch "$MAME_TAG" \
            --filter=blob:none https://github.com/mamedev/mame.git \
            "$RUNNER_TEMP/mame0289"
          test "$(git -C "$RUNNER_TEMP/mame0289" rev-parse HEAD)" = "$MAME_COMMIT"
          echo "Source commit pinned: $MAME_COMMIT"
          test -s "$RUNNER_TEMP/mame0289/src/mame/capcom/cps1_v.cpp"
          test -s "$RUNNER_TEMP/mame0289/src/mame/capcom/cps1.cpp"

      - name: Instrument the actual upstream C++ and audit exact insertions
        shell: bash
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/mame0289/src/mame/capcom/cps1_v.cpp"
          generated="$RUNNER_TEMP/cps1_v.instrumented.cpp"
          python3 tools/mame_obj_source_probe.py "$original" --out "$generated"
          python3 tools/mame_obj_real_source_audit.py "$original" "$generated"
          cp "$generated" "$original"
          # Only the video source in this temporary checkout may differ.
          test "$(git -C "$RUNNER_TEMP/mame0289" diff --name-only)" = \
            'src/mame/capcom/cps1_v.cpp'

      - name: Compile real instrumented CPS-1 driver and dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mame0289"
          # Official upstream mame0289 subset-build interface. This is
          # the real emulator, not the Stage 58 mock cps_state harness.
          # No ROM paths, dino ROMs, or game binary data are used.
          make -j2 SUBTARGET=dino \
            SOURCES=src/mame/capcom/cps1.cpp \
            REGENIE=1 NOWERROR=1 SYMBOLS=0 OPTIMIZE=0 \
            TOOLS=0 TESTS=0

      - name: Verify resulting emulator without loading game ROMs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mame0289"
          binary="$(find . -maxdepth 1 -type f -executable \
            -name '*dino*' -print -quit)"
          if [[ -z "$binary" ]]; then
            echo "No executable matching CPS-1 dino subtarget was built" >&2
            exit 1
          fi
          echo "Instrumented real MAME built successfully: $binary"
          # Require the original 0.289 dino XML, freshly compiled
          # CPS-1 ELF .o AND all three probe markers in the final linked
          # executable. A stale V2-only executable must fail closed.
          # No original game ROMs, screenshots or emulator binaries uploaded.
          python3 "$GITHUB_WORKSPACE/tools/mame_dino_binary_verify.py" \
            "$binary" "$RUNNER_TEMP/mame0289"
          echo "Verified genuine dino driver and instrumented CPS-1 ELF"

      - name: Validate real MAME frontend rejects an empty ROM directory
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mame0289"
          binary="$(find . -maxdepth 1 -type f -executable \
            -name '*dino*' -print -quit)"
          test -n "$binary"
          empty_rompath="$RUNNER_TEMP/rom-free-empty-set"
          mkdir -m 700 "$empty_rompath"
          # This is a NEGATIVE integration smoke test, deliberately run
          # against an empty temporary ROM directory. No game image data
          # is ever downloaded, used, printed or attached to artifacts.
          if "$binary" dino -verifyroms -rompath "$empty_rompath" \
               -noreadconfig > "$RUNNER_TEMP/rom-free-negative-smoke.log" 2>&1; then
            echo "Unexpected success verifying an absent dino ROM set" >&2
            exit 1
          fi
          echo "Genuine MAME frontend rejected missing private ROMs as expected"
          # Do not print the MAME frontend's potentially verbose messages.
          rm -f "$RUNNER_TEMP/rom-free-negative-smoke.log"

      - name: Package only the instrumented open-source MAME Linux executable
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mame0289"
          binary="$(find . -maxdepth 1 -type f -executable \
            -name '*dino*' -print -quit)"
          test -n "$binary"
          output="$RUNNER_TEMP/rom-free-dino-linux"
          mkdir -m 700 "$output"
          install -m 0755 "$binary" "$output/dino"
          sha256sum "$output/dino" > "$output/dino.sha256"
          cat > "$output/README.txt" <<'EOF'
          MAME 0.289 CPS-1 dino — Linux executable, NO GAME ROMS.
          Source: official mamedev/mame tag mame0289.
          Pinned original source commit: f34f02505e32c1993c6a782b6814232cbfc74e36
          CPS-1 instrumentation: repository tools/mame_obj_source_probe.py
          This is a ROM-free build artifact only, NOT a playable game.
          Keep the game ROM private and outside the GitHub repository.
          The strict private launcher also expects a matching full MAME
          source/build tree with instrumented CPS-1 object files, not
          merely this executable archive alone.
          License and notices: refer to upstream MAME source tree.
          EOF

      - name: Preserve ROM-free instrumented MAME Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: mame0289-instrumented-dino-linux-rom-free
          path: ${{ runner.temp }}/rom-free-dino-linux/
          if-no-files-found: error
          retention-days: 7
