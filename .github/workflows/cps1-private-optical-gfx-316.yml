name: Stage316 code-only original-gfx optical NRO (private runtime gated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source/main.c'
      - 'tools/nexium_private_original_gfx_optical_316.py'
      - 'tests/test_nexium_private_original_gfx_optical_316.py'
      - 'tests/test_nexium_optical_frame_capture_313.py'
      - '.github/workflows/cps1-private-optical-gfx-316.yml'

permissions:
  contents: read

concurrency:
  group: stage316-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-only-privacy-and-regressions:
    runs-on: ubuntu-26.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install decoder dependency for synthetic optical test fixtures only
        run: python3 -m pip install Pillow==11.3.0 --break-system-packages
      - name: Run strictly ROM-free Stage313/315/316 regression suites
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_nexium_optical_frame_capture_313.py' -v
          python3 -m unittest discover -s tests -p 'test_cps1_private_original_gfx_synthetic_sd_315.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_private_original_gfx_optical_316.py' -v
      - name: Verify no original graphics or gameplay present in source checkout
        run: python3 tools/check_public_tree_rom_free.py

  opt-in-arm64-nro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile private-opt-in NRO with NO original ROM or graphics
        run: |
          set -eu
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/portlibs/switch/bin" >> "$GITHUB_PATH"
          make -j2 DEFINES="-DDINO_SYNTHETIC_SCENE_GUEST_PROBE -DDINO_PRIVATE_ORIGINAL_GFX_HOST_VISIBLE_316"
          python3 - <<'PY'
          import struct
          from pathlib import Path
          data=Path("cadillacs-dinosaurs-switch.nro").read_bytes()
          assert data[0x10:0x14]==b"NRO0"
          assert 0x80<=struct.unpack_from("<I",data,0x18)[0]<=len(data)
          assert b"cadillacs-synthetic-scene-guest.csv" in data
          assert b"cadillacs-synthetic-scene-next-%02u.txt" in data
          assert b"ROM-FREE CPS1 SYNTHETIC PIXELS STAGE308" in data
          print("STAGE316_CODE_ONLY_OPT_IN_ARM64_GUEST_READY")
          PY
          sha256sum cadillacs-dinosaurs-switch.nro > stage316-nro.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: stage316-public-code-only-arm64-nro-private-original-gfx-optin
          path: |
            cadillacs-dinosaurs-switch.nro
            stage316-nro.sha256
          if-no-files-found: error
          retention-days: 2
