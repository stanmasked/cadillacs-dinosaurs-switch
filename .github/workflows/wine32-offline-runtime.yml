name: Historical MAME 0.106 Wine32 offline runtime

on:
  push:
    paths:
      - '.github/workflows/wine32-offline-runtime.yml'
  pull_request:
    paths:
      - '.github/workflows/wine32-offline-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bundle-wine32:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Install Wine32, Xvfb, and download tools
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture i386
          apt-get update
          mkdir -p /tmp/wine-debs/partial
          rm -f /tmp/wine-debs/*.deb
          DEBIAN_FRONTEND=noninteractive apt-get \
            -o Dir::Cache::archives=/tmp/wine-debs/ \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
              ca-certificates curl unzip xvfb xauth wine wine32:i386 wine64
          wine --version

      - name: Fetch and smoke-test source-pinned MAME artifact (ROM-free)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/stanmasked/cadillacs-dinosaurs-switch/actions/artifacts?per_page=100" \
            --output /tmp/artifacts.json
          artifact_id="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/artifacts.json').read_text())
          candidates = [
              a for a in data.get('artifacts', [])
              if a.get('name') == 'historical-mame0106-runtime-rom-free'
              and not a.get('expired', True)
              and a.get('workflow_run', {}).get('head_branch')
                  == 'feature/mame0106-synthetic-trace-counters-329'
          ]
          if not candidates:
              raise SystemExit('No unexpired source-pinned MAME 0.106 artifact for the Stage329 branch')
          print(max(candidates, key=lambda a: a['created_at'])['id'])
          PY
          )"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/stanmasked/cadillacs-dinosaurs-switch/actions/artifacts/${artifact_id}/zip" \
            --output /tmp/mame-runtime.zip
          mkdir -p /tmp/mame-runtime
          unzip -q /tmp/mame-runtime.zip -d /tmp/mame-runtime
          (cd /tmp/mame-runtime && sha256sum --check SHA256SUMS.txt)
          export WINEPREFIX=/tmp/wineprefix
          export WINEARCH=win32
          export WINEDEBUG=-all
          xvfb-run -a wine /tmp/mame-runtime/mame0106.exe -help > /tmp/mame-help.txt 2>&1
          grep -q 'M.A.M.E. v0.106' /tmp/mame-help.txt
          xvfb-run -a wine /tmp/mame-runtime/mame0106.exe -listxml > /tmp/mame-listxml.xml 2>/tmp/mame-listxml-stderr.txt
          grep -q '<game name="dino"' /tmp/mame-listxml.xml
          printf '%s\n' 'Wine32 MAME 0.106 help/listxml smoke tests: PASS' 'Original ROMs and input recordings used: NO'

      - name: Prepare offline Debian package bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wine32-offline/debs
          cp /tmp/wine-debs/*.deb wine32-offline/debs/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('wine32-offline/debs')
          rows = []
          for package in sorted(root.glob('*.deb')):
              values = subprocess.check_output(
                  ['dpkg-deb', '-f', str(package), 'Package', 'Version', 'Architecture'],
                  text=True
              ).splitlines()
              if len(values) != 3:
                  raise SystemExit(f'Invalid package metadata in {package.name}')
              rows.append('\t'.join([package.name, *values, str(package.stat().st_size)]))
          if not rows:
              raise SystemExit('No Debian packages were collected')
          Path('wine32-offline/package-manifest.tsv').write_text(
              'deb_filename\tpackage\tversion\tarchitecture\tsize_bytes\n'
              + '\n'.join(rows) + '\n', encoding='utf-8')
          PY
          {
            printf '%s\n' 'Purpose: offline installation of the public Debian Trixie Wine32 runtime for local MAME 0.106 diagnostics.'
            printf '%s\n' 'Contains Debian .deb packages only; no ROMs, INP/WLF recordings, captures, or game data.'
            printf 'Wine version: '
            wine --version
            printf 'Host architecture: '
            dpkg --print-architecture
            printf 'Foreign architectures: '
            dpkg --print-foreign-architectures | tr '\n' ' '
            printf '\n'
          } > wine32-offline/README.txt
          (cd wine32-offline && find debs -type f -name '*.deb' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test -s wine32-offline/package-manifest.tsv
          test -s wine32-offline/SHA256SUMS.txt

      - name: Upload short-lived offline Wine32 packages
        uses: actions/upload-artifact@v4
        with:
          name: wine32-debian-trixie-offline-packages
          path: wine32-offline/
          retention-days: 1
          if-no-files-found: error
