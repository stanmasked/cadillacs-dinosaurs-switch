name: Historical MAME 0.106 Wine32 offline runtime

on:
  push:
    paths:
      - '.github/workflows/wine32-offline-runtime.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  bundle-wine32:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    timeout-minutes: 45
    steps:
      - name: Install Node.js action runtime and Wine32 build dependencies
        shell: bash
        run: |
          set -euo pipefail
          dpkg --add-architecture i386
          apt-get update
          # JavaScript actions need Node.js inside this Debian job container.
          # Install it before redirecting the APT archive cache so Node packages
          # remain build-only and are not included in the offline Wine bundle.
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nodejs
          node --version
          mkdir -p /tmp/wine-debs/partial
          chown _apt:root /tmp/wine-debs/partial
          chmod 700 /tmp/wine-debs/partial
          rm -f /tmp/wine-debs/*.deb
          DEBIAN_FRONTEND=noninteractive apt-get \
            -o Dir::Cache::archives=/tmp/wine-debs/ \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends \
              ca-certificates curl unzip python3 xvfb xauth wine wine32:i386 wine64
          wine --version
          # Debian Multi-Arch: same libraries must have matching i386 and
          # amd64 versions. Runner images may already have the amd64 half
          # installed, so only the i386 .deb lands in APT's download cache.
          # Explicitly carry matching amd64 .deb files for offline hosts.
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('/tmp/wine-debs')
          installed_archives = set()
          i386_multiarch = set()
          for archive in sorted(root.glob('*.deb')):
              def field(key):
                  return subprocess.check_output(
                      ['dpkg-deb', '-f', str(archive), key],
                      text=True).strip()
              package = field('Package')
              version = field('Version')
              arch = field('Architecture')
              installed_archives.add((package, version, arch))
              if arch == 'i386' and field('Multi-Arch') == 'same':
                  i386_multiarch.add((package, version))

          missing_mirrors = sorted(
              (package, version) for package, version in i386_multiarch
              if (package, version, 'amd64') not in installed_archives)
          for package, version in missing_mirrors:
              subprocess.run(
                  ['apt-get', 'download', f'{package}:amd64={version}'],
                  cwd=root, check=True)
          for package, version in missing_mirrors:
              candidates = root.glob(f'{package}_*amd64.deb')
              if not any(
                  subprocess.check_output(
                      ['dpkg-deb', '-f', str(candidate), 'Version'],
                      text=True).strip() == version
                  for candidate in candidates):
                  raise SystemExit(f'Missing matching amd64 .deb: {package}')
          print(f'Bundled {len(missing_mirrors)} amd64 Multi-Arch mirrors')
          PY

      - name: Prepare isolated QEMU i386 ELF helper
        shell: bash
        run: |
          set -euo pipefail
          # Debian Trixie made qemu-user-static a transitional package.
          # Fetch the last Bookworm static emulator through signed APT metadata;
          # extract only qemu-i386-static, never install it on the runner.
          printf '%s\n' 'deb https://deb.debian.org/debian bookworm main' \
            > /etc/apt/sources.list.d/bookworm-qemu-helper.list
          apt-get update
          mkdir -p /tmp/qemu-helper/download /tmp/qemu-helper/root qemu-i386-helper
          cd /tmp/qemu-helper/download
          apt-get download 'qemu-user-static=1:7.2+dfsg-7+deb12u18+b3'
          deb=$(find . -maxdepth 1 -type f -name 'qemu-user-static_*.deb' -print -quit)
          test -n "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = qemu-user-static
          test "$(dpkg-deb -f "$deb" Version)" = '1:7.2+dfsg-7+deb12u18+b3'
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          dpkg-deb -x "$deb" /tmp/qemu-helper/root
          helper=/tmp/qemu-helper/root/usr/bin/qemu-i386-static
          test -x "$helper"
          cp "$helper" "$GITHUB_WORKSPACE/qemu-i386-helper/qemu-i386-static"
          cp /tmp/qemu-helper/root/usr/share/doc/qemu-user-static/copyright \
            "$GITHUB_WORKSPACE/qemu-i386-helper/COPYRIGHT.txt"
          "$GITHUB_WORKSPACE/qemu-i386-helper/qemu-i386-static" --version \
            > "$GITHUB_WORKSPACE/qemu-i386-helper/version.txt"
          # Exercise a real i386 Wine ELF through QEMU, not just the helper's CLI.
          "$GITHUB_WORKSPACE/qemu-i386-helper/qemu-i386-static" -L / \
            /usr/lib/wine/wine --version \
            > "$GITHUB_WORKSPACE/qemu-i386-helper/wine32-under-qemu.txt" 2>&1
          grep -q 'wine-10.0' "$GITHUB_WORKSPACE/qemu-i386-helper/wine32-under-qemu.txt"
          printf '%s\n' \
            'source=Debian Bookworm signed APT repository' \
            'package=qemu-user-static' \
            'version=1:7.2+dfsg-7+deb12u18+b3' \
            'architecture=amd64' \
            'purpose=private local execution of i386 Wine binaries only' \
            'contains_original_game_data=no' \
            > "$GITHUB_WORKSPACE/qemu-i386-helper/metadata.txt"
          cd "$GITHUB_WORKSPACE/qemu-i386-helper"
          sha256sum qemu-i386-static COPYRIGHT.txt version.txt wine32-under-qemu.txt metadata.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload isolated QEMU i386 helper
        uses: actions/upload-artifact@v4
        with:
          name: qemu-i386-static-private-runtime-helper
          path: qemu-i386-helper/
          retention-days: 7
          if-no-files-found: error

      - name: Prepare offline Debian package bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wine32-offline/debs
          cp /tmp/wine-debs/*.deb wine32-offline/debs/
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('wine32-offline/debs')
          rows = []
          for package in sorted(root.glob('*.deb')):
              fields = subprocess.check_output(
                  ['dpkg-deb', '-f', str(package), 'Package', 'Version', 'Architecture'],
                  text=True
              ).splitlines()
              parsed = []
              for field in fields:
                  if ': ' not in field:
                      raise SystemExit(f'Invalid package metadata in {package.name}')
                  parsed.append(field.split(': ', 1))
              if [key for key, _ in parsed] != ['Package', 'Version', 'Architecture']:
                  raise SystemExit(f'Unexpected package metadata fields in {package.name}')
              values = [value for _, value in parsed]
              if len(values) != 3 or any(not value for value in values):
                  raise SystemExit(f'Invalid package metadata in {package.name}')
              rows.append('\t'.join([package.name, *values, str(package.stat().st_size)]))
          if not rows:
              raise SystemExit('No Debian packages were collected')
          Path('wine32-offline/package-manifest.tsv').write_text(
              'deb_filename\tpackage\tversion\tarchitecture\tsize_bytes\n'
              + '\n'.join(rows) + '\n', encoding='utf-8')
          PY
          {
            printf '%s\n' 'Purpose: offline installation of the public Debian Trixie Wine32 runtime for local MAME 0.106 diagnostics.'
            printf '%s\n' 'Contains Debian .deb packages only; no ROMs, INP/WLF recordings, captures, or game data.'
            printf 'Wine version: '
            wine --version
            printf 'Host architecture: '
            dpkg --print-architecture
            printf 'Foreign architectures: '
            dpkg --print-foreign-architectures | tr '\n' ' '
            printf '\n'
          } > wine32-offline/README.txt
          (cd wine32-offline && find debs -type f -name '*.deb' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          test -s wine32-offline/package-manifest.tsv
          test -s wine32-offline/SHA256SUMS.txt

      - name: Upload short-lived offline Wine32 packages
        uses: actions/upload-artifact@v4
        with:
          name: wine32-debian-trixie-offline-packages
          path: wine32-offline/
          retention-days: 7
          if-no-files-found: error

      # Fetch only the ROM-free Stage329 source-pinned technical binary.
      # Never stage original ROM, INP, WLF or captures in public CI.
      - name: Download pinned ROM-free MAME 0.106 artifact
        uses: actions/download-artifact@v4
        with:
          name: historical-mame0106-runtime-rom-free
          run-id: 39859311511
          github-token: ${{ github.token }}
          path: /tmp/stage332-mame

      - name: Stage333 ROM-free Wine32 launcher audit
        shell: bash
        run: |
          set -euo pipefail
          sh -n tools/wolfmame0106_private_wine_launcher.sh
          chmod +x tools/wolfmame0106_private_wine_launcher.sh
          cd /tmp/stage332-mame
          sha256sum -c SHA256SUMS.txt
          printf '%s\n' 'a3b0526056c2ecd10415a5757f0085aa6977992feddbb232ca60c7c446f81d44  mame0106.exe' | sha256sum -c -
          grep -Fxq 'source_commit=0a83d596c83b4d1a72cb3a7b1d2835b809206f2f' source-pin.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct
          exe = Path('mame0106.exe').read_bytes()
          assert exe.startswith(b'MZ')
          pe = struct.unpack_from('<I', exe, 0x3c)[0]
          assert exe[pe:pe + 6] == b'PE\x00\x00\x4c\x01'
          PY
          export MAME0106_EXE=/tmp/stage332-mame/mame0106.exe
          export WINEPREFIX=/tmp/stage332-romfree-wine
          export WINE_BIN=wine
          export WINEDEBUG=-all
          mkdir -p "$WINEPREFIX"
          # Negative guard test: a MAME executable inside the repository is refused.
          printf '%s\n' 'not an executable' > "$GITHUB_WORKSPACE/stage333-forbidden-mame.exe"
          if MAME0106_EXE="$GITHUB_WORKSPACE/stage333-forbidden-mame.exe" WINEPREFIX="$WINEPREFIX" WINE_BIN=wine "$GITHUB_WORKSPACE/tools/wolfmame0106_private_wine_launcher.sh" -help > /tmp/stage333-negative-guard.txt 2>&1; then
            echo 'launcher unexpectedly accepted a repository-local MAME path' >&2
            exit 1
          fi
          grep -q 'outside the repository' /tmp/stage333-negative-guard.txt
          rm -f "$GITHUB_WORKSPACE/stage333-forbidden-mame.exe"
          # Exercise the exact launcher path consumed by private gate/capture tools.
          timeout --signal=TERM --kill-after=5s 90s xvfb-run -a "$GITHUB_WORKSPACE/tools/wolfmame0106_private_wine_launcher.sh" -help > /tmp/stage333-mame-help.txt 2>&1
          grep -q 'M.A.M.E. v0.106' /tmp/stage333-mame-help.txt
          timeout --signal=TERM --kill-after=5s 90s xvfb-run -a "$GITHUB_WORKSPACE/tools/wolfmame0106_private_wine_launcher.sh" -showconfig > /tmp/stage333-mame-config.txt 2>&1
          grep -qi mngcounttrace /tmp/stage333-mame-config.txt
          timeout --signal=TERM --kill-after=5s 120s xvfb-run -a "$GITHUB_WORKSPACE/tools/wolfmame0106_private_wine_launcher.sh" -listxml > /tmp/stage333-mame-driver.xml 2>/tmp/stage333-mame-stderr.txt
          grep -q '<game name="dino"' /tmp/stage333-mame-driver.xml
          printf '%s\n' 'STAGE333_PRIVATE_WINE_LAUNCHER_ROM_FREE_AUDIT_PASS' 'Original ROM, INP, WLF and game captures: NOT USED'
