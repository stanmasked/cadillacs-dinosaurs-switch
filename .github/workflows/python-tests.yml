name: CPS-1 Python tools

on:
  push:
    paths:
      - 'tools/**'
      - 'source/cps1_tile.c'
      - 'source/cps1_tile.h'
      - 'source/cps1_scene.c'
      - 'source/cps1_scene.h'
      - 'source/cps1_sequence.c'
      - 'source/cps1_sequence.h'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'source/cps1_tile.c'
      - 'source/cps1_tile.h'
      - 'source/cps1_scene.c'
      - 'source/cps1_scene.h'
      - 'source/cps1_sequence.c'
      - 'source/cps1_sequence.h'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
      - '.github/workflows/switch-bootstrap.yml'
      - 'Makefile'
  workflow_dispatch:

# Cancel superseded runs for the same event and PR/ref. Keep different
# workflows, branches and manually dispatched checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run synthetic ROM mapping and tile decoder tests
        run: python -m unittest discover -s tests -v
      - name: Compile and run portable C tile decoder tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isource \
            tests/cps1_tile_native_test.c source/cps1_tile.c -o /tmp/cps1_tile_tests
          /tmp/cps1_tile_tests
      - name: Validate OBJ instrumentation against unmodified upstream MAME 0.289
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            --retry-delay 2 --connect-timeout 15 --max-time 60 \
            https://raw.githubusercontent.com/mamedev/mame/mame0289/src/mame/capcom/cps1_v.cpp \
            --output "$tmp/cps1_v.cpp"
          python tools/mame_obj_source_probe.py "$tmp/cps1_v.cpp" \
            --out "$tmp/cps1_v.instrumented.cpp"
          python tools/mame_obj_real_source_audit.py \
            "$tmp/cps1_v.cpp" "$tmp/cps1_v.instrumented.cpp"

      - name: Preserve code-only scene parity reproduction sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cps1-scene-parity-source-rom-free
          retention-days: 3
          if-no-files-found: error
          path: |
            source/cps1_scene.c
            source/cps1_scene.h
            source/cps1_tile.c
            source/cps1_tile.h
            tools/cps1_gfx.py
            tools/cps1_tiles.py
            tools/cps1_video.py
            tools/cps1_raster.py
            tools/cps1_frame.py
            tools/cps1_scene_export.py
            tools/cps1_private_native_tile_parity.py
            tools/cps1_private_scene_compositor_parity.py

  build-upstream-mame-0106:
    # This is intentionally opt-in for this PR: never spend the full legacy
    # emulator build on unrelated project changes. Manual dispatch can use it
    # later once the workflow is present on the default branch.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'feature/mame0106-reproducible-runtime-283') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Install 32-bit MinGW build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            make
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            nasm

      - name: Checkout exact upstream MAME 0.106 source
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch mame0106 https://github.com/mamedev/historic-mame.git upstream-mame
          actual="$(git -C upstream-mame rev-parse HEAD)"
          expected="0a83d596c83b4d1a72cb3a7b1d2835b809206f2f"
          test "$actual" = "$expected"
          printf 'source_repository=https://github.com/mamedev/historic-mame\nsource_tag=mame0106\nsource_commit=%s\n' "$actual" > source-pin.txt
          mkdir -p runtime-artifact

      - name: Build upstream MAME 0.106 command-line runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd upstream-mame
          # Modern MinGW's DirectDraw headers renamed the numbered-union macro.
          # Restore the alias expected by this 2006 source tree as a tiny,
          # recorded build-only patch; no gameplay code or ROM data is touched.
          cat >> src/windows/winprefix.h <<'EOF'
          #ifndef DUMMYUNIONNAMEN
          #define DUMMYUNIONNAMEN(n) DUMMYUNIONNAME##n
          #endif
          EOF
          git diff --check
          git diff -- src/windows/winprefix.h > ../runtime-artifact/mame0106-build-compat.patch
          test -s ../runtime-artifact/mame0106-build-compat.patch
          printf 'build_compat_patch=mame0106-build-compat.patch\n' >> ../source-pin.txt
          # SYMBOLS=1 avoids the 2006 makefile's -Werror default, which is
          # incompatible with diagnostics from current MinGW compilers.
          # Override ASM directly; do not set COMPILESYSTEM_CYGWIN because that
          # activates the obsolete -mno-cygwin flag removed from modern MinGW.
          make -f makefile TARGET=mame MAMEOS=windows ASM=@nasm SYMBOLS=1 -j2
          test -s mame.exe
          objdump -f mame.exe | grep -q 'pei-i386'
          cp mame.exe ../runtime-artifact/mame0106.exe
          cp COPYING ../runtime-artifact/COPYING
          git archive --format=zip --prefix=mame0106/ HEAD > ../runtime-artifact/mame0106-source.zip
          cd ../runtime-artifact
          sha256sum mame0106.exe mame0106-source.zip > SHA256SUMS.txt
          cp ../source-pin.txt .
          cat > runtime-status.txt <<'EOF'
          Runtime source: mamedev/historic-mame tag mame0106
          Build target: 32-bit Windows / MinGW
          WolfMAME-specific anti-cheat additions: NOT INCLUDED
          Original dino.inp playback: NOT RUN
          Original dino.wlf validation: NOT RUN
          ROM files included: NO
          Original game frames included: NO
          Physical Nintendo Switch tested: NO
          EOF

      - name: Upload source-pinned emulator and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: historical-mame0106-runtime-rom-free
          retention-days: 3
          if-no-files-found: error
          path: runtime-artifact/
