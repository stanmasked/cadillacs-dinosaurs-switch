name: CPS-1 Python tools

on:
  push:
    paths:
      - 'tools/**'
      - 'source/cps1_tile.c'
      - 'source/cps1_tile.h'
      - 'source/cps1_scene.c'
      - 'source/cps1_scene.h'
      - 'source/cps1_sequence.c'
      - 'source/cps1_sequence.h'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'source/cps1_tile.c'
      - 'source/cps1_tile.h'
      - 'source/cps1_scene.c'
      - 'source/cps1_scene.h'
      - 'source/cps1_sequence.c'
      - 'source/cps1_sequence.h'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run synthetic ROM mapping and tile decoder tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee python-tests.log
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cps1-python-test-diagnostics
          path: python-tests.log
          if-no-files-found: warn
      - name: Compile and run portable C tile decoder tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isource \
            tests/cps1_tile_native_test.c source/cps1_tile.c -o /tmp/cps1_tile_tests
          /tmp/cps1_tile_tests
