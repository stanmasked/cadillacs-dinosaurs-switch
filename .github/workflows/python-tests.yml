name: CPS-1 Python tools

on:
  push:
    paths:
      - 'tools/**'
      - 'source/cps1_tile.c'
      - 'source/cps1_tile.h'
      - 'source/cps1_scene.c'
      - 'source/cps1_scene.h'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'source/cps1_tile.c'
      - 'source/cps1_tile.h'
      - 'source/cps1_scene.c'
      - 'source/cps1_scene.h'
      - 'tests/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run synthetic ROM mapping and tile decoder tests
        run: python -m unittest discover -s tests -v
      - name: Compile and run portable C tile decoder tests
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Isource \
            tests/cps1_tile_native_test.c source/cps1_tile.c -o /tmp/cps1_tile_tests
          /tmp/cps1_tile_tests
