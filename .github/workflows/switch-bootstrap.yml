name: Nintendo Switch native bootstrap

on:
  push:
    paths:
      - 'source/**'
      - 'Makefile'
      - '.github/workflows/switch-bootstrap.yml'
  pull_request:
    # Verify the NRO on every code-or-test PR, including diagnostic-only
    # updates, rather than relying on a build from a historical branch.
    paths:
      - 'source/**'
      - 'Makefile'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/switch-bootstrap.yml'
  workflow_dispatch:

# Cancel superseded runs for the same event and PR/ref. Keep different
# workflows, branches and manually dispatched checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-switch-nro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Build native Nintendo Switch bootstrap
        run: make -j2
      - name: Verify NRO header and generate checksum
        run: |
          set -eu
          test -s cadillacs-dinosaurs-switch.nro
          # Nintendo Switch NRO format: ASCII NRO0 at file offset 0x10.
          test "$(dd if=cadillacs-dinosaurs-switch.nro bs=1 skip=16 count=4 status=none)" = 'NRO0'
          sha256sum cadillacs-dinosaurs-switch.nro > cadillacs-dinosaurs-switch.nro.sha256
          sha256sum --check cadillacs-dinosaurs-switch.nro.sha256
          file cadillacs-dinosaurs-switch.nro || true
      - name: Upload NRO and checksum (ROM-free technical bootstrap)
        uses: actions/upload-artifact@v4
        with:
          name: cadillacs-dinosaurs-switch-bootstrap
          path: |
            cadillacs-dinosaurs-switch.nro
            cadillacs-dinosaurs-switch.nro.sha256
          if-no-files-found: error

  build-upstream-mame-0106:
    # Isolate the slow historical build from the main Python CI concurrency
    # group. This branch-only gate keeps unrelated PRs from compiling MAME 0.106.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'feature/mame0106-reproducible-runtime-283') }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Install 32-bit MinGW build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            make
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            nasm

      - name: Checkout exact upstream MAME 0.106 source
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch mame0106 https://github.com/mamedev/historic-mame.git upstream-mame
          actual="$(git -C upstream-mame rev-parse HEAD)"
          expected="0a83d596c83b4d1a72cb3a7b1d2835b809206f2f"
          test "$actual" = "$expected"
          printf 'source_repository=https://github.com/mamedev/historic-mame\nsource_tag=mame0106\nsource_commit=%s\n' "$actual" > source-pin.txt
          mkdir -p runtime-artifact

      - name: Build upstream MAME 0.106 command-line runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd upstream-mame
          # Current MinGW headers renamed the DirectDraw union macro expected
          # by this 2006 source. Preserve a tiny build-only compatibility patch.
          cat >> src/windows/winprefix.h <<'EOF'
          #ifndef DUMMYUNIONNAMEN
          #define DUMMYUNIONNAMEN(n) DUMMYUNIONNAME##n
          #endif
          EOF
          git diff --check
          git diff -- src/windows/winprefix.h > ../runtime-artifact/mame0106-build-compat.patch
          test -s ../runtime-artifact/mame0106-build-compat.patch
          printf 'build_compat_patch=mame0106-build-compat.patch\n' >> ../source-pin.txt
          # SYMBOLS=1 avoids old -Werror; ASM override avoids removed -mno-cygwin.
          make -f makefile TARGET=mame MAMEOS=windows ASM=@nasm SYMBOLS=1 -j2
          test -s mame.exe
          objdump -f mame.exe | grep -q 'pei-i386'
          cp mame.exe ../runtime-artifact/mame0106.exe
          cp COPYING ../runtime-artifact/COPYING
          git archive --format=zip --prefix=mame0106/ HEAD > ../runtime-artifact/mame0106-source.zip
          cd ../runtime-artifact
          sha256sum mame0106.exe mame0106-source.zip > SHA256SUMS.txt
          cp ../source-pin.txt .
          cat > runtime-status.txt <<'EOF'
          Runtime source: mamedev/historic-mame tag mame0106
          Build target: 32-bit Windows / MinGW
          WolfMAME-specific anti-cheat additions: NOT INCLUDED
          Original dino.inp playback: NOT RUN
          Original dino.wlf validation: NOT RUN
          ROM files included: NO
          Original game frames included: NO
          Physical Nintendo Switch tested: NO
          EOF

      - name: Upload source-pinned emulator and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: historical-mame0106-runtime-rom-free
          retention-days: 3
          if-no-files-found: error
          path: runtime-artifact/
