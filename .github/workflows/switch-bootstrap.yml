name: Nintendo Switch native bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'Makefile'
      - 'mame0106-windowed-mng-capture.patch.txt'
      - '.github/workflows/switch-bootstrap.yml'
  pull_request:
    # Verify the NRO on every code-or-test PR, including diagnostic-only
    # updates, rather than relying on a build from a historical branch.
    paths:
      - 'source/**'
      - 'Makefile'
      - 'tools/**'
      - 'tests/**'
      - 'mame0106-windowed-mng-capture.patch.txt'
      - '.github/workflows/switch-bootstrap.yml'
  workflow_dispatch:

# Cancel superseded runs for the same event and PR/ref. Keep different
# workflows, branches and manually dispatched checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-switch-nro:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64:20260219
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Build native Nintendo Switch bootstrap
        run: make -j2
      - name: Verify NRO header and generate checksum
        run: |
          set -eu
          test -s cadillacs-dinosaurs-switch.nro
          # Nintendo Switch NRO format: ASCII NRO0 at file offset 0x10.
          test "$(dd if=cadillacs-dinosaurs-switch.nro bs=1 skip=16 count=4 status=none)" = 'NRO0'
          sha256sum cadillacs-dinosaurs-switch.nro > cadillacs-dinosaurs-switch.nro.sha256
          sha256sum --check cadillacs-dinosaurs-switch.nro.sha256
          file cadillacs-dinosaurs-switch.nro || true
      - name: Upload NRO and checksum (ROM-free technical bootstrap)
        uses: actions/upload-artifact@v4
        with:
          name: cadillacs-dinosaurs-switch-bootstrap
          path: |
            cadillacs-dinosaurs-switch.nro
            cadillacs-dinosaurs-switch.nro.sha256
          if-no-files-found: error

  build-upstream-mame-0106:
    # Isolate the slow historical build from the main Python CI concurrency
    # group. This branch-only gate keeps unrelated PRs from compiling MAME 0.106.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'feature/mame0106-reproducible-runtime-283' || github.head_ref == 'feature/mame0106-private-capture-runner-285' || github.head_ref == 'feature/mame0106-private-window-capture-286' || github.head_ref == 'feature/mame0106-inprocess-counters-290' || github.head_ref == 'feature/mame0106-synthetic-z80-smoke-295' || github.head_ref == 'feature/mame0106-synthetic-mng-diagnostic-328' || github.head_ref == 'feature/mame0106-synthetic-trace-counters-329' || github.head_ref == 'feature/mame0106-wine-offline-bundle-330')) }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout capture tooling and source patch
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            make
            python
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            nasm

      - name: Checkout exact upstream MAME 0.106 source
        shell: msys2 {0}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch mame0106 https://github.com/mamedev/historic-mame.git upstream-mame
          actual="$(git -C upstream-mame rev-parse HEAD)"
          expected="0a83d596c83b4d1a72cb3a7b1d2835b809206f2f"
          test "$actual" = "$expected"
          printf 'source_repository=https://github.com/mamedev/historic-mame\nsource_tag=mame0106\nsource_commit=%s\n' "$actual" > source-pin.txt
          mkdir -p runtime-artifact
          # Avoid Windows autocrlf changing historical source lines before patching.
          git -C upstream-mame config core.autocrlf false
          git -C upstream-mame checkout-index --all --force
          # Git for Windows can leave historical 2006 source files as CRLF,
          # while our anchored source patch uses LF. Normalize ONLY the
          # four public upstream source files touched by the patch.
          perl -pi -e 's/\r\n/\n/g' upstream-mame/src/video.h upstream-mame/src/video.c upstream-mame/src/windows/video.c upstream-mame/src/windows/video.h
          # The PR patch itself is a tracked .txt file; actions/checkout on
          # Windows may also convert THAT file to CRLF. Normalize both sides.
          perl -pi -e 's/\r\n/\n/g' mame0106-windowed-mng-capture.patch.txt
          git -C upstream-mame apply --check ../mame0106-windowed-mng-capture.patch.txt
          git -C upstream-mame apply ../mame0106-windowed-mng-capture.patch.txt
          git -C upstream-mame diff --check
          # Stage290 is anchored to the exact upstream tree after Stage286.
          # The trace contains ONLY monotone input-read/video-callback counters.
          python tools/mame0106_stage290_trace_patch.py --root upstream-mame
          git -C upstream-mame diff --check
          printf 'window_capture_patch=mame0106-windowed-mng-capture.patch\n' >> source-pin.txt
          printf 'inprocess_counter_trace=enabled_on_request\n' >> source-pin.txt

      - name: Build upstream MAME 0.106 command-line runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cd upstream-mame
          # Current MinGW headers use named DirectDraw unions, but the 2006
          # source defines NONAMELESSUNION after windows.h and expects the old
          # DUMMYUNIONNAMEN(n) macro. Restore the alias and correct include order
          # in these three legacy DirectDraw renderer translation units.
          cat >> src/windows/winprefix.h <<'EOF'
          #ifndef DUMMYUNIONNAMEN
          #define DUMMYUNIONNAMEN(n) DUMMYUNIONNAME##n
          #endif
          EOF
          perl -0pi -e 's/#define WIN32_LEAN_AND_MEAN\n#include <windows\.h>\n\n#ifdef __GNUC__\n #define NONAMELESSUNION\n#endif\n#include <ddraw\.h>/#define WIN32_LEAN_AND_MEAN\n#ifdef __GNUC__\n #define NONAMELESSUNION\n#endif\n#include <windows.h>\n#include <ddraw.h>/g' src/windows/wind3d.c src/windows/wind3dfx.c src/windows/winddraw.c
          # The current MinGW d3dtypes.h leaves DUMMYUNIONNAME1..8 as literal
          # members of D3DTLVERTEX. Qualify the seven fields used by MAME's
          # preprocess vertices; D3DTLVERTEX2 in d3d_extra.h remains unchanged.
          perl -0pi -e 's/(preprocess_vertex\[[^\]]+\])\.sx/$1.DUMMYUNIONNAME1.sx/g; s/(preprocess_vertex\[[^\]]+\])\.sy/$1.DUMMYUNIONNAME2.sy/g; s/(preprocess_vertex\[[^\]]+\])\.rhw/$1.DUMMYUNIONNAME4.rhw/g; s/(preprocess_vertex\[[^\]]+\])\.color/$1.DUMMYUNIONNAME5.color/g; s/(preprocess_vertex\[[^\]]+\])\.specular/$1.DUMMYUNIONNAME6.specular/g; s/(preprocess_vertex\[[^\]]+\])\.tu/$1.DUMMYUNIONNAME7.tu/g; s/(preprocess_vertex\[[^\]]+\])\.tv/$1.DUMMYUNIONNAME8.tv/g' src/windows/wind3d.c
          grep -q 'preprocess_vertex\[0\]\.DUMMYUNIONNAME1\.sx' src/windows/wind3d.c
          git diff --check
          git diff -- src/windows/winprefix.h src/windows/wind3d.c src/windows/wind3dfx.c src/windows/winddraw.c > ../runtime-artifact/mame0106-build-compat.patch
          test -s ../runtime-artifact/mame0106-build-compat.patch
          git diff -- src/video.c src/video.h src/windows/video.c src/windows/video.h > ../runtime-artifact/mame0106-windowed-mng-capture.patch
          test -s ../runtime-artifact/mame0106-windowed-mng-capture.patch
          # Reproduction artifact must include every patched source file.
          for source in src/video.c src/video.h src/windows/video.c src/windows/video.h; do
            grep -Fq "diff --git a/${source} b/${source}" ../runtime-artifact/mame0106-windowed-mng-capture.patch
          done
          git diff -- src/inptport.c src/video.c src/video.h src/windows/video.c src/windows/video.h > ../runtime-artifact/mame0106-inprocess-count-trace-combined.patch
          test -s ../runtime-artifact/mame0106-inprocess-count-trace-combined.patch
          for source in src/inptport.c src/video.c src/video.h src/windows/video.c src/windows/video.h; do
            grep -Fq "diff --git a/${source} b/${source}" ../runtime-artifact/mame0106-inprocess-count-trace-combined.patch
          done
          printf 'build_compat_patch=mame0106-build-compat.patch\n' >> ../source-pin.txt
          printf 'inprocess_counter_source_patch=mame0106-inprocess-count-trace-combined.patch\n' >> ../source-pin.txt
          # SYMBOLS=1 avoids old -Werror; ASM override avoids removed -mno-cygwin.
          make -f makefile TARGET=mame MAMEOS=windows ASM=@nasm SYMBOLS=1 -j2
          test -s mame.exe
          objdump -f mame.exe | grep -q 'pei-i386'
          # Verify that this binary actually executes without private ROMs.
          ./mame.exe -help > ../runtime-artifact/mame0106-help.txt 2>&1
          grep -q 'M.A.M.E. v0.106' ../runtime-artifact/mame0106-help.txt
          printf 'help_smoke_test=passed\n' >> ../source-pin.txt
          # Check that the historical options required by the private capture
          # runner are present, without loading ROMs or executing gameplay.
          ./mame.exe -showconfig > ../runtime-artifact/mame0106-showconfig.txt 2>&1
          grep -qi 'playback' ../runtime-artifact/mame0106-showconfig.txt
          grep -qi 'frames_to_run' ../runtime-artifact/mame0106-showconfig.txt
          grep -qi 'mngwrite' ../runtime-artifact/mame0106-showconfig.txt
          grep -qi 'mngstartframe' ../runtime-artifact/mame0106-showconfig.txt
          grep -qi 'mngframes' ../runtime-artifact/mame0106-showconfig.txt
          grep -qi 'mngcounttrace' ../runtime-artifact/mame0106-showconfig.txt
          grep -qi 'throttle' ../runtime-artifact/mame0106-showconfig.txt
          printf 'playback_and_windowed_mng_options_smoke_test=passed\n' >> ../source-pin.txt
          # Also enumerate the driver table without loading any game ROMs.
          ./mame.exe -listxml > ../runtime-artifact/dino-driver.xml
          grep -q '<game name="dino"' ../runtime-artifact/dino-driver.xml
          printf 'listxml_smoke_test=passed\ndino_driver_listed=yes\n' >> ../source-pin.txt
          cp mame.exe ../runtime-artifact/mame0106.exe
          # The mame0106 tree has docs/license.txt, not a COPYING file.
          cp docs/license.txt ../runtime-artifact/MAME-0106-LICENSE.txt
          git archive --format=zip --prefix=mame0106/ HEAD > ../runtime-artifact/mame0106-source.zip
          cd ../runtime-artifact
          sha256sum mame0106.exe mame0106-source.zip mame0106-build-compat.patch mame0106-windowed-mng-capture.patch mame0106-inprocess-count-trace-combined.patch dino-driver.xml mame0106-help.txt mame0106-showconfig.txt > SHA256SUMS.txt
          cp ../source-pin.txt .
          cat > runtime-status.txt <<'EOF'
          Runtime source: mamedev/historic-mame tag mame0106
          Build target: 32-bit Windows / MinGW
          ROM-free command-line help smoke test: PASSED
          ROM-free -listxml smoke test: PASSED
          dino driver listed in upstream driver table: YES
          WolfMAME-specific anti-cheat additions: NOT INCLUDED
          Original dino.inp playback: NOT RUN
          Original dino.wlf validation: NOT RUN
          ROM files included: NO
          Original game frames included: NO
          Bounded MNG frame-window options: YES (source patch included)
          In-process input/video count trace: YES (opt-in, no private CI playback)
          Input-to-video frame alignment independently verified: NO
          Physical Nintendo Switch tested: NO
          EOF

      - name: Upload source-pinned emulator and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: historical-mame0106-runtime-rom-free
          # ROM-free technical archive only. Durable owner backup is in Drive.
          retention-days: 90
          if-no-files-found: error
          path: runtime-artifact/

      - name: Stage295 synthesize Z80 test ROM only AFTER production artifact
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # This is an isolated test-only alteration. The source-pinned,
          # original-ROM-free MAME executable above has ALREADY been copied
          # to runtime-artifact/ and uploaded in the preceding action.
          # Do NOT upload the synthetic ROM, this modified executable,
          # its MNG frames, INP recording or raw child-process logs.
          perl -pi -e 's/\r\n/\n/g' upstream-mame/src/drivers/minivadr.c
          python tools/mame0106_synthetic_minivadr_fixture_295.py \
            --source-root upstream-mame \
            --rom-dir synthetic295-roms
          test -s synthetic295-roms/minivadr/d26-01.bin
          cd upstream-mame
          # Recompile ONLY the temporary Minivader checksum change;
          # never replace the already published production MAME artifact.
          make -f makefile TARGET=mame MAMEOS=windows ASM=@nasm SYMBOLS=1 -j2
          cd ..
          python tools/mame0106_synthetic_runtime_probe_295.py \
            --emulator upstream-mame/mame.exe \
            --rom-root synthetic295-roms \
            --out stage295-synthetic-only-status.json
          # Every branch requires the real MAME ROM checker to accept the
          # synthetic Z80 fixture and forbids original game inputs. Stage329
          # additionally makes full synthetic record/replay, MNG integrity,
          # and advancing input-read counters a required CI result.
          python -c "import json, os; d=json.load(open('stage295-synthetic-only-status.json')); assert d['synthetic_minivader_rom_verification'] is True; assert d['original_dino_rom_or_inp_used'] is False; assert os.environ.get('GITHUB_HEAD_REF') != 'feature/mame0106-synthetic-trace-counters-329' or d['status'] == 'SYNTHETIC_MINIVADER_MAME_VIDEO_AND_INPUT_READ_CONFIRMED'"
          # Only aggregate status may be printed. No synthetic ROM or
          # modified binary gets added to the public runtime artifact.
          test ! -e runtime-artifact/d26-01.bin
          test ! -e runtime-artifact/stage295-synthetic-only-status.json
