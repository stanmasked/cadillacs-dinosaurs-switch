      - 'tests/test_nexium_guest_frame_phase_skip_decomposition.py'
      - 'tools/nexium_guest_frame_topology.py'
      - 'tests/test_nexium_guest_frame_topology.py'
      - 'tools/nexium_guest_frame_gap_burst_audit.py'
      - 'tests/test_nexium_guest_frame_gap_burst_audit.py'
