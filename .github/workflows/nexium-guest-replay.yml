# Cancel superseded runs for the same event and PR/ref. Keep different
# workflows, branches and manually dispatched checks independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-guest-nro:
    strategy:
      fail-fast: false
      matrix:
        audio_mode: ${{ fromJSON(github.event_name == 'pull_request' && '["baseline","extra-poll"]' || github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'extra-poll' && '["extra-poll"]' || '["baseline"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure devkitPro and compile selected ROM-free Switch guest mode
        env:
          DINO_AUDIO_MODE: ${{ matrix.audio_mode }}
        run: |
          # The devkitPro container's default shell is POSIX sh, not bash.
          # No pipelines are used here; -eu supplies portable fail-fast.
          set -eu
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/portlibs/switch/bin" >> "$GITHUB_PATH"
          case "$DINO_AUDIO_MODE" in
            baseline)
              defines="-DDINO_EMULATOR_SELFTEST"
              ;;
            extra-poll)
              defines="-DDINO_EMULATOR_SELFTEST -DDINO_AUDIO_EXPERIMENT_MID_BATCH_POLL"
              ;;
            *)
              echo "Unsupported audio mode" >&2
              exit 1
              ;;
          esac
          make -j2 DEFINES="$defines"
          printf '%s\n' "$DINO_AUDIO_MODE" > dino-guest-audio-mode.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct
          file=Path("cadillacs-dinosaurs-switch.nro")
          blob=file.read_bytes()
          assert blob[0x10:0x14]==b"NRO0"
          declared=struct.unpack_from("<I",blob,0x18)[0]
          assert 0x80<=declared<=len(blob)
          assert b"cadillacs-arena-selftest.csv" in blob
          assert b"cadillacs-counter-guest.csv" in blob
          assert b"FRAME_SUBMITTED" in blob
          assert b"REPLAY_DONE" in blob
          print("ROM-free NRO with guest-origin evidence compiled")
          PY
          sha256sum cadillacs-dinosaurs-switch.nro
          sha256sum cadillacs-dinosaurs-switch.nro > dino-guest-nro.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dino-nexium-selftest-nro-${{ matrix.audio_mode }}
          path: |
            cadillacs-dinosaurs-switch.nro
            dino-guest-audio-mode.txt
            dino-guest-nro.sha256
          retention-days: 7
          if-no-files-found: error

  run-real-guest:
    needs: build-guest-nro
    strategy:
      fail-fast: false
      matrix:
        audio_mode: ${{ fromJSON(github.event_name == 'pull_request' && '["baseline","extra-poll"]' || github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'extra-poll' && '["extra-poll"]' || '["baseline"]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dino-nexium-selftest-nro-${{ matrix.audio_mode }}
          path: emulator-input
      - name: Verify mode manifest and NRO integrity before execution
        env:
          DINO_AUDIO_MODE: ${{ matrix.audio_mode }}
        run: |
          set -euo pipefail
          test "$(cat emulator-input/dino-guest-audio-mode.txt)" = "$DINO_AUDIO_MODE"
          (cd emulator-input && sha256sum -c dino-guest-nro.sha256)
      - name: Test script syntax and refuse synthetic malformed guest reports
        run: |
          bash -n tools/nexium_guest_replay_probe.sh
          python3 -m unittest discover -s tests -p 'test_nexium_guest_replay.py' -v
          python3 -m unittest discover -s tests -p 'test_dino_guest_counter.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_guest_counter_hid.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_guest_natural_counter_hid.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_guest_live_counter_hid.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_guest_counter_framebuffer.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_guest_emulator_asset_pin.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_hid_fallback_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_audio.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_guest_controller.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_hid_timeline.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_input_pixel.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_live_counter_pixel.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_frame_token.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_frame_token_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_capture_window.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_keydown_bracket.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_transition.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_sample_sequence.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_sample_sequence_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_cadence_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_first_sample_gap_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_first_sample_gap_rounding.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_frame_token_rollover.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_native_frame_pixel_ttl_binding.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_transition_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_keydown_bracket_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_capture_window_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_spar_audio_bound.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_audio_stress.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_audio_mode_binding.py' -v
      - name: Install Xvfb and software Vulkan dependencies for NeXium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb xauth xdotool imagemagick mesa-vulkan-drivers libvulkan1 \
            vulkan-tools libgtk-3-0 libasound2t64 libudev1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libx11-xcb1 \
            libegl1 libgles2 libgl1 libpulse0 \
            pulseaudio pulseaudio-utils libasound2-plugins
      - name: Attempt actual ARM64 homebrew guest execution
        env:
          DINO_AUDIO_MODE: ${{ matrix.audio_mode }}
        run: |
          bash tools/nexium_guest_replay_probe.sh \
            emulator-input/cadillacs-dinosaurs-switch.nro \
            emulator-evidence
      - name: Attest selected mode from actual guest audio stress counters
        env:
          DINO_AUDIO_MODE: ${{ matrix.audio_mode }}
        run: |
          python3 tools/verify_nexium_audio_mode_binding.py \
            --selected-mode "$DINO_AUDIO_MODE" \
            --report emulator-evidence/guest-audio-stress-evidence.json \
            --nro emulator-input/cadillacs-dinosaurs-switch.nro \
            --out emulator-evidence/guest-audio-mode-binding.json
      - name: Attest optional host X11 command to captured frame interval
        env:
          DINO_AUDIO_MODE: ${{ matrix.audio_mode }}
        run: |
          # The preceding step created guest-audio-mode-binding.json.
          # This OPTIONAL report independently checks the exact NRO,
          # real guest frame token, libnx counter and selected audio mode.
          # No physical input-to-display latency is asserted.
          python3 tools/verify_nexium_host_capture_window.py \
            --guest-dir emulator-evidence \
            --nro emulator-input/cadillacs-dinosaurs-switch.nro \
            --mode "$DINO_AUDIO_MODE" \
            --out emulator-evidence/host-capture-interval-attestation.json
          # Stage 257: an additional OPTIONAL host-monotonic bound from
          # the beginning of the xdotool subprocess, which must agree with
          # the previously attested completed-command to XGetImage sample.
          python3 tools/verify_nexium_host_keydown_bracket.py \
            --guest-dir emulator-evidence \
            --nro emulator-input/cadillacs-dinosaurs-switch.nro \
            --mode "$DINO_AUDIO_MODE" \
            --out emulator-evidence/host-keydown-bracket-attestation.json
          # Stage 259 OPTIONAL: only claim an observed X11 transition
          # interval if a REAL post-trigger nonmatching four-pixel image
          # precedes the first token/NRO-bound matching X11 image. Missing
          # negative images yield honest INCONCLUSIVE, not a timing claim.
          python3 tools/verify_nexium_host_x11_transition.py \
            --guest-dir emulator-evidence \
            --nro emulator-input/cadillacs-dinosaurs-switch.nro \
            --mode "$DINO_AUDIO_MODE" \
            --out emulator-evidence/host-x11-transition-bracket-attestation.json
          # Stage 261 OPTIONAL: independently verify EVERY post-command
          # X11 4-RGB/call-bound sample, not just last absent/first present.
          # Reject sample reordering, missing negatives, forged tokens and
          # unsupported first-display-onset claims. No screenshots saved.
          python3 tools/verify_nexium_host_x11_sample_sequence.py \
            --guest-dir emulator-evidence \
            --nro emulator-input/cadillacs-dinosaurs-switch.nro \
            --mode "$DINO_AUDIO_MODE" \
            --out emulator-evidence/host-x11-sample-sequence-attestation.json
      - name: Preserve verified result or honest inconclusive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dino-ne-xium-actual-nro-guest-evidence-${{ matrix.audio_mode }}
          path: |
            emulator-evidence/result.txt
            emulator-evidence/metadata.txt
            emulator-evidence/emulator-hash-check.txt
            emulator-evidence/emulator-stdout.txt
            emulator-evidence/vulkan.txt
            emulator-evidence/guest-replay.csv
            emulator-evidence/guest-counter.csv
            emulator-evidence/guest-counter-evidence.json
            emulator-evidence/guest-counter-hid.csv
            emulator-evidence/guest-counter-hid-evidence.json
            emulator-evidence/host-zr-attempt.json
            emulator-evidence/host-natural-zr-attempt.json
            emulator-evidence/guest-natural-counter-hid.csv
            emulator-evidence/guest-natural-counter-hid-evidence.json
            emulator-evidence/host-live-zr-attempt.json
            emulator-evidence/host-counter-window-evidence.json
            emulator-evidence/host-frame-token-evidence.json
            emulator-evidence/guest-live-counter-frame-tokens.csv
            emulator-evidence/host-guest-frame-token-evidence.json
            emulator-evidence/host-capture-window-evidence.json
            emulator-evidence/host-capture-interval-attestation.json
            emulator-evidence/host-keydown-bracket-evidence.json
            emulator-evidence/host-keydown-bracket-attestation.json
            emulator-evidence/host-x11-transition-bracket-evidence.json
            emulator-evidence/host-x11-transition-bracket-attestation.json
            emulator-evidence/host-x11-sample-sequence-evidence.json
            emulator-evidence/host-x11-sample-sequence-attestation.json
            emulator-evidence/guest-live-counter-hid.csv
            emulator-evidence/guest-live-counter-hid-evidence.json
            emulator-evidence/guest-live-counter-framebuffer.csv
            emulator-evidence/guest-live-counter-framebuffer-evidence.json
            emulator-evidence/guest-window.png
            emulator-evidence/frame-pixels.txt
            emulator-evidence/host-audio-evidence.json
            emulator-evidence/guest-controller-evidence.json
            emulator-evidence/guest-controller.csv
            emulator-evidence/guest-hid-timeline-evidence.json
            emulator-evidence/guest-hid-timeline.csv
            emulator-evidence/host-input-bound-evidence.json
            emulator-evidence/host-pixel-raw.json
            emulator-evidence/host-spar-raw.json
            emulator-evidence/host-spar-audio-evidence.json
            emulator-evidence/guest-audio-stress-evidence.json
            emulator-evidence/guest-audio-mode-binding.json
            emulator-evidence/guest-audio-stress.csv
            emulator-evidence/guest-audio-ack-ticks.csv
            emulator-evidence/guest-audio-ack-tick-evidence.json
            emulator-evidence/guest-frame-clock.csv
            emulator-evidence/guest-frame-clock-evidence.json
            emulator-evidence/xdg-config/NeXium/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  compare-pr-guest-audio:
    if: ${{ github.event_name == 'pull_request' }}
    needs: run-real-guest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download actual baseline guest evidence
        uses: actions/download-artifact@v4
        with:
          name: dino-ne-xium-actual-nro-guest-evidence-baseline
          path: paired/baseline
      - name: Download actual experimental guest evidence
        uses: actions/download-artifact@v4
        with:
          name: dino-ne-xium-actual-nro-guest-evidence-extra-poll
          path: paired/extra-poll
      - name: Download baseline NRO build artifact for hash verification
        uses: actions/download-artifact@v4
        with:
          name: dino-nexium-selftest-nro-baseline
          path: paired/build-baseline
      - name: Download experimental NRO build artifact for hash verification
        uses: actions/download-artifact@v4
        with:
          name: dino-nexium-selftest-nro-extra-poll
          path: paired/build-extra-poll
      - name: Verify bound guest evidence and compare two modes
        run: |
          python3 -m unittest discover -s tests -p 'test_nexium_audio_paired_artifacts.py' -v
          DINO_CONTROLLED_AUDOUT_RESULT=controlled-host-audout-result.json \
            python3 -m unittest discover -s tests -p 'test_nexium_audio_controlled_mock.py' -v
          python3 tools/nexium_audio_control_plan.py --out controlled-host-audout-plan.json
          python3 -m unittest discover -s tests -p 'test_nexium_audio_controlled_oracle.py' -v
          python3 tools/verify_nexium_audio_controlled_oracle.py \
            --plan controlled-host-audout-plan.json \
            --result controlled-host-audout-result.json \
            --out controlled-host-audout-oracle.json
          python3 tools/nexium_audio_release_corpus.py \
            --out controlled-host-release-corpus-plan.json
          DINO_CONTROLLED_AUDOUT_CORPUS_PLAN=controlled-host-release-corpus-plan.json \
            DINO_CONTROLLED_AUDOUT_CORPUS_RESULT=controlled-host-release-corpus-result.json \
            python3 -m unittest discover -s tests -p 'test_nexium_audio_release_corpus.py' -v
          python3 tools/nexium_audio_release_corpus.py \
            --corpus controlled-host-release-corpus-plan.json \
            --result controlled-host-release-corpus-result.json \
            --out controlled-host-release-corpus-attestation.json
          python3 tools/nexium_audio_intertick_phase.py \
            --out controlled-host-intertick-plan.json
          DINO_INTERTICK_RESULT=controlled-host-intertick-result.json \
            python3 -m unittest discover -s tests -p 'test_nexium_audio_intertick_phase.py' -v
          python3 tools/nexium_audio_intertick_phase.py \
            --plan controlled-host-intertick-plan.json \
            --result controlled-host-intertick-result.json \
            --out controlled-host-intertick-attestation.json
          python3 -m unittest discover -s tests -p 'test_nexium_audio_queue_capacity_bound.py' -v
          python3 tools/nexium_audio_queue_capacity_bound.py \
            --out controlled-host-capacity-bound.json
          python3 -m unittest discover -s tests -p 'test_nexium_audio_queue_depth_tradeoff.py' -v
          python3 tools/nexium_audio_queue_depth_tradeoff.py \
            --out controlled-host-depth-tradeoff.json
          python3 -m unittest discover -s tests -p 'test_nexium_audio_occupancy_service.py' -v
          python3 tools/nexium_audio_occupancy_service.py \
            --out controlled-host-occupancy-feedback.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path('controlled-host-audout-plan.json').read_text())
          result=json.loads(Path('controlled-host-audout-result.json').read_text())
          assert result['stimulus_sha256']==plan['stimulus_sha256']
          assert result['total_measured_ticks']==plan['total_simulation_ticks']
          assert len(result['per_150tick_counters'])==6
          assert result['host_input_schedule_matched'] is True
          assert result['guest_frame_pacing_matched_verified'] is False
          print('ROM-free controlled native C adapter provenance verified')
          PY
          python3 tools/verify_nexium_audio_paired_artifacts.py \
            --baseline-report paired/baseline/guest-audio-stress-evidence.json \
            --baseline-binding paired/baseline/guest-audio-mode-binding.json \
            --experimental-report paired/extra-poll/guest-audio-stress-evidence.json \
            --experimental-binding paired/extra-poll/guest-audio-mode-binding.json \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --experimental-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-audio-comparison.json
          # Stage 241: recheck real NRO-bound ZR and PCM separately for
          # baseline and extra-poll. Missing guest data fails CI, rather
          # than silently treating an optional verifier as a pass.
          python3 -m unittest discover -s tests -p 'test_nexium_guest_counter_hid_paired.py' -v
          python3 tools/verify_nexium_guest_counter_hid_paired.py \
            --baseline-csv paired/baseline/guest-counter-hid.csv \
            --baseline-json paired/baseline/guest-counter-hid-evidence.json \
            --baseline-report paired/baseline/guest-audio-stress-evidence.json \
            --baseline-binding paired/baseline/guest-audio-mode-binding.json \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-csv paired/extra-poll/guest-counter-hid.csv \
            --extra-json paired/extra-poll/guest-counter-hid-evidence.json \
            --extra-report paired/extra-poll/guest-audio-stress-evidence.json \
            --extra-binding paired/extra-poll/guest-audio-mode-binding.json \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-real-zr-counter-pcm-attestation.json
          # Stage 245: the optional Stage 244 natural guest witnesses
          # are now required from BOTH actual libnx guest builds in PR CI.
          # Re-run the old staged gate and bind both modes to their full
          # NRO SHA-256; missing/forged/late natural HID evidence fails.
          python3 -m unittest discover -s tests -p 'test_nexium_guest_natural_counter_hid_paired.py' -v
          python3 tools/verify_nexium_guest_natural_counter_hid_paired.py \
            --baseline-natural-csv paired/baseline/guest-natural-counter-hid.csv \
            --baseline-natural-json paired/baseline/guest-natural-counter-hid-evidence.json \
            --baseline-staged-csv paired/baseline/guest-counter-hid.csv \
            --baseline-staged-json paired/baseline/guest-counter-hid-evidence.json \
            --baseline-report paired/baseline/guest-audio-stress-evidence.json \
            --baseline-binding paired/baseline/guest-audio-mode-binding.json \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-natural-csv paired/extra-poll/guest-natural-counter-hid.csv \
            --extra-natural-json paired/extra-poll/guest-natural-counter-hid-evidence.json \
            --extra-staged-csv paired/extra-poll/guest-counter-hid.csv \
            --extra-staged-json paired/extra-poll/guest-counter-hid-evidence.json \
            --extra-report paired/extra-poll/guest-audio-stress-evidence.json \
            --extra-binding paired/extra-poll/guest-audio-mode-binding.json \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-natural-zr-counter-pcm-attestation.json
          # Stage 247: require genuine Stage 246 visible/player-facing
          # arena libnx Y/X/ZR counter evidence from BOTH PR NRO modes.
          # The verifier rechecks the required previous natural/staged
          # counter PCM, audout hashes and exact binary SHA-256 binding.
          # Host xdotool events alone cannot satisfy any live CSV.
          python3 -m unittest discover -s tests -p 'test_nexium_guest_live_counter_hid_paired.py' -v
          python3 tools/verify_nexium_guest_live_counter_hid_paired.py \
            --baseline-live-csv paired/baseline/guest-live-counter-hid.csv \
            --baseline-live-json paired/baseline/guest-live-counter-hid-evidence.json \
            --baseline-natural-csv paired/baseline/guest-natural-counter-hid.csv \
            --baseline-natural-json paired/baseline/guest-natural-counter-hid-evidence.json \
            --baseline-staged-csv paired/baseline/guest-counter-hid.csv \
            --baseline-staged-json paired/baseline/guest-counter-hid-evidence.json \
            --baseline-report paired/baseline/guest-audio-stress-evidence.json \
            --baseline-binding paired/baseline/guest-audio-mode-binding.json \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-live-csv paired/extra-poll/guest-live-counter-hid.csv \
            --extra-live-json paired/extra-poll/guest-live-counter-hid-evidence.json \
            --extra-natural-csv paired/extra-poll/guest-natural-counter-hid.csv \
            --extra-natural-json paired/extra-poll/guest-natural-counter-hid-evidence.json \
            --extra-staged-csv paired/extra-poll/guest-counter-hid.csv \
            --extra-staged-json paired/extra-poll/guest-counter-hid-evidence.json \
            --extra-report paired/extra-poll/guest-audio-stress-evidence.json \
            --extra-binding paired/extra-poll/guest-audio-mode-binding.json \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-visible-arena-zr-pcm-attestation.json
          # Stage 249: Stage 248 submitted-framebuffer pixels are mandatory
          # in BOTH independent real NeXium guest modes, not optional.
          # Do not confuse native guest buffer sampling with host display.
          python3 -m unittest discover -s tests -p 'test_nexium_guest_counter_framebuffer.py' -v
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from tools import verify_nexium_guest_counter_framebuffer as framebuffer
          for mode in ('baseline', 'extra-poll'):
              guest = Path('paired') / mode
              source = guest / 'guest-live-counter-framebuffer.csv'
              live = guest / 'guest-live-counter-hid.csv'
              recalculated = framebuffer.verify(source, live)
              saved = json.loads(
                  (guest / 'guest-live-counter-framebuffer-evidence.json').read_text())
              if saved != recalculated:
                  raise ValueError(f'{mode}: framebuffer evidence mismatch')
              metadata = dict(line.split('=', 1)
                              for line in (guest / 'metadata.txt').read_text().splitlines()
                              if '=' in line)
              nro = (Path('paired') / ('build-' + mode) /
                     'cadillacs-dinosaurs-switch.nro').read_bytes()
              if metadata.get('nro_sha256') != hashlib.sha256(nro).hexdigest():
                  raise ValueError(f'{mode}: guest framebuffer NRO provenance mismatch')
              if not recalculated['native_guest_framebuffer_pixels_verified']:
                  raise ValueError(f'{mode}: no genuine submitted-frame pixels')
              if recalculated['host_emulator_screen_pixel_verified']:
                  raise ValueError(f'{mode}: unsupported host-screen verification')
          print('Required Stage 249: both real guest submitted-framebuffer proofs match NROs')
          PY
          # Stage 251: require BOTH real NeXium host X11 four-pixel frames.
          # Xvfb host window, NOT LCD photons or precise input latency.
          python3 -m unittest discover -s tests -p 'test_nexium_host_counter_window_paired.py' -v
          python3 tools/verify_nexium_host_counter_window_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-counter-window-attestation.json
          # Stage 254: REQUIRE the host-window token in the SAME X11
          # image as the four real pixels to uniquely match a submitted
          # guest render iteration in EACH separate NRO mode. The paired
          # gate re-verifies raw CSV/JSON, 900-tick mode and whole NRO SHA.
          # Neither host↔frame identity nor X11 pixels imply physical
          # scanout or controller-to-display latency.
          python3 -m unittest discover -s tests -p 'test_nexium_host_frame_token_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_capture_window.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_keydown_bracket.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_transition.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_sample_sequence.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_sample_sequence_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_cadence_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_first_sample_gap_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_first_sample_gap_rounding.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_frame_token_rollover.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_native_frame_pixel_ttl_binding.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_transition_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_keydown_bracket_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_capture_window_paired.py' -v
          python3 tools/verify_nexium_host_frame_token_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-guest-frame-token-attestation.json
          # Stage 256: require independent host X11 XGetImage call interval
          # on both live NeXium modes. Recalculate genuine native frame,
          # full guest NRO SHA and audio-mode binding before trusting host
          # timestamps. This is NOT input-to-guest, GPU scanout or LCD
          # latency; neither mode is ranked by elapsed sampling intervals.
          python3 -m unittest discover -s tests -p 'test_nexium_host_capture_window_paired.py' -v
          python3 tools/verify_nexium_host_capture_window_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-x11-capture-call-attestation.json
          # Stage 258: REQUIRED host-monotonic xdotool invocation→X11
          # sampling bounds for TWO separately NRO-bound genuine guest
          # frames. Replay native ZR, audio mode and all Stage 254–256
          # witnesses. Neither input-to-photon nor guest HID latency.
          python3 -m unittest discover -s tests -p 'test_nexium_host_keydown_bracket_paired.py' -v
          python3 tools/verify_nexium_host_keydown_bracket_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-keydown-bracket-attestation.json
          # Stage 260: REQUIRED real X11 last post-ZR negative image and
          # first token-bound four-pixel positive image on BOTH separate
          # NRO runs. Recalculate raw observed RGB/time and guest/mode
          # provenance; never claim actual first visual onset/photons.
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_transition_paired.py' -v
          python3 tools/verify_nexium_host_x11_transition_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-x11-transition-attestation.json
          # Stage 262 REQUIRED: both real NRO-bound post-command X11
          # sample series must match raw chronological host RGB/times,
          # per-guest native frame and saved single-mode attestation.
          # This does not prove first physical visual onset or latency.
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_sample_sequence_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_x11_cadence_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_first_sample_gap_paired.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_first_sample_gap_rounding.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_host_frame_token_rollover.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_native_frame_pixel_ttl_binding.py' -v
          python3 tools/verify_nexium_host_x11_sample_sequence_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-x11-sample-sequence-attestation.json
          # Stage 263: recheck both REAL Stage 262 source sequences and
          # report rounded X11 capture-call widths, gaps and blind spots.
          # These are host sampling intervals, NOT first-onset or
          # controller-to-display latency measurements.
          python3 tools/verify_nexium_host_x11_cadence_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-x11-cadence-attestation.json
          # Stage 264: require independently bound host xdotool subprocess
          # completion to first X11 capture-call blind interval on BOTH
          # real guest modes. This is NOT first display onset or latency.
          python3 tools/verify_nexium_host_first_sample_gap_paired.py \
            --baseline-dir paired/baseline \
            --extra-dir paired/extra-poll \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --extra-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out paired-host-first-sample-gap-attestation.json
          python3 -m unittest discover -s tests -p 'test_nexium_guest_ack_observability.py' -v
          python3 tools/verify_nexium_guest_ack_observability.py \
            --baseline-report paired/baseline/guest-audio-stress-evidence.json \
            --baseline-binding paired/baseline/guest-audio-mode-binding.json \
            --baseline-nro paired/build-baseline/cadillacs-dinosaurs-switch.nro \
            --experimental-report paired/extra-poll/guest-audio-stress-evidence.json \
            --experimental-binding paired/extra-poll/guest-audio-mode-binding.json \
            --experimental-nro paired/build-extra-poll/cadillacs-dinosaurs-switch.nro \
            --out bound-guest-ack-observability.json
          python3 -m unittest discover -s tests -p 'test_nexium_audio_crosswindow_carry.py' -v
          python3 -m unittest discover -s tests -p 'test_nexium_audio_ack_tick_trace.py' -v
          python3 tools/verify_nexium_audio_ack_tick_trace.py \
            --trace paired/baseline/guest-audio-ack-ticks.csv \
            --report paired/baseline/guest-audio-stress-evidence.json \
            --mode baseline --out paired-baseline-ack-tick-evidence.json
          python3 tools/verify_nexium_audio_ack_tick_trace.py \
            --trace paired/extra-poll/guest-audio-ack-ticks.csv \
            --report paired/extra-poll/guest-audio-stress-evidence.json \
            --mode extra-poll --out paired-extra-ack-tick-evidence.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          for group,name in [('baseline','paired-baseline-ack-tick-evidence.json'),
                             ('extra-poll','paired-extra-ack-tick-evidence.json')]:
              recorded=Path('paired')/group/'guest-audio-ack-tick-evidence.json'
              fresh=Path(name)
              assert json.loads(recorded.read_text())==json.loads(fresh.read_text())
